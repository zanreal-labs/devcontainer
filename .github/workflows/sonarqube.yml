# SonarQube Cloud analysis, driven from CI.
#
# This repository has no test suite, so there is no coverage to ingest; the
# workflow exists because Automatic Analysis stopped re-scanning main and a
# CI-driven scan does not depend on that toggle. One thing the repository
# owner has to do before a scan can succeed:
#
#   1. Set the SONAR_TOKEN secret to a token scoped to the `zanreal`
#      organization (`gh secret set SONAR_TOKEN --repo zanreal-labs/devcontainer`).
#   2. Disable Automatic Analysis for zanreal-labs_devcontainer under project
#      Administration > Analysis Method if it is still enabled; the two modes
#      are mutually exclusive.
#
# Until step 1 is done this workflow self-skips and reports green, so it cannot
# turn CI red on anyone's pull request in the meantime.
name: SonarQube

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Secrets cannot be read from a job-level `if:`, so token presence is probed
  # in a job of its own and the scan depends on its output. A missing SONAR_TOKEN
  # is a configuration state, not a broken pull request: the scan is skipped,
  # never failed. The same applies to pull requests from forks, which never get
  # the secret at all.
  guard:
    name: Check configuration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      has_token: ${{ steps.token.outputs.has_token }}

    steps:
      - name: Detect SONAR_TOKEN
        id: token
        env:
          HAS_TOKEN: ${{ secrets.SONAR_TOKEN != '' }}
        run: |
          echo "has_token=$HAS_TOKEN" >> "$GITHUB_OUTPUT"
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "::notice title=SonarQube skipped::SONAR_TOKEN is not set on this repository, so no analysis was submitted. Set the secret to enable the scan."
          fi

  sonarqube:
    name: Scan
    needs: guard
    if: needs.guard.outputs.has_token == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Read-only: the scan clones the repository and submits results to
    # SonarQube Cloud with SONAR_TOKEN. Pull request decoration is posted by
    # the SonarCloud GitHub App, not by this workflow's token.
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Sonar needs the full history to attribute blame and to resolve the
          # new code period; a shallow clone silently degrades both.
          fetch-depth: 0

      - name: SonarQube scan
        uses: sonarsource/sonarqube-scan-action@2291811965ea69a1e14dc78bff987f2e2b1d8b37 # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
