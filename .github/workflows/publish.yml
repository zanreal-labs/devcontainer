name: Publish Image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate changelog with Claude Code
        id: changelog
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          npm install -g @anthropic-ai/claude-code
          PREV_TAG=$(git tag --sort=-v:refname | grep '^v' | sed -n '2p')
          REPO="${{ github.repository }}"
          DIFF=$(git log --format="%H %s" "${PREV_TAG}..${TAG_NAME}" 2>/dev/null || git log --format="%H %s" -20)
          CHANGELOG=$(echo "$DIFF" | claude -p \
            "Generate a concise changelog for release ${TAG_NAME} of a devcontainer project. Group changes by category (Features, Fixes, Docs, Chores). Use markdown with bullet points. For each item, link the short commit hash to https://github.com/${REPO}/commit/<full_hash>. No preamble, just the changelog. Here are the commits:" \
            --output-format text)
          {
            echo "body<<CHANGELOG_EOF"
            echo "$CHANGELOG"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: gh release create "$TAG_NAME" --title "$TAG_NAME" --notes "${{ steps.changelog.outputs.body }}"
