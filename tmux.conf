# ── Terminal ─────────────────────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"

# ── Status bar — purple matching gum TUI (#A855F7) ───────────────────────────
set -g status on
set -g status-style          "bg=#A855F7,fg=#ffffff"
set -g status-left-style     "bg=#A855F7,fg=#ffffff"
set -g status-right-style    "bg=#A855F7,fg=#ffffff"

set -g status-left  " #[bold]#S#[nobold]  "
set -g status-right " %H:%M  %d %b "
set -g status-justify left
set -g status-interval 5

# Window tabs
set -g window-status-format         " #I #W "
set -g window-status-current-format " #I #W "
set -g window-status-style          "bg=#A855F7,fg=#e0e0e0"
set -g window-status-current-style  "bg=#7C3AED,fg=#ffffff,bold"
set -g window-status-separator      ""

# ── Pane borders ─────────────────────────────────────────────────────────────
set -g pane-border-style        "fg=#7C3AED"
set -g pane-active-border-style "fg=#A855F7"

# ── Messages ─────────────────────────────────────────────────────────────────
set -g message-style "bg=#7C3AED,fg=#ffffff"

# ── General ──────────────────────────────────────────────────────────────────
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 10000
set -sg escape-time 10
