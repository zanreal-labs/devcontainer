# CI-driven SonarQube Cloud analysis; consumed by .github/workflows/sonarqube.yml.
# This repository is shell scripts, Dockerfiles and devcontainer feature JSON;
# there is no test suite and therefore no coverage input.
sonar.projectKey=zanreal-labs_devcontainer
sonar.organization=zanreal

sonar.sources=.
sonar.exclusions=node_modules/**,.git/**
